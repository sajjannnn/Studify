services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-1
      - auth-2
      - auth-3
    restart: unless-stopped

  auth-1:
    build: ./auth
    env_file: ./auth/.env
    restart: unless-stopped

  auth-2:
    build: ./auth
    env_file: ./auth/.env
    restart: unless-stopped

  auth-3:
    build: ./auth
    env_file: ./auth/.env
    restart: unless-stopped

  notes:
    build: ./notes
    env_file: ./notes/.env
    restart: unless-stopped

  workspace:
    build: ./workspace
    env_file: ./workspace/.env
    restart: unless-stopped

  search:
    build: ./search
    env_file: ./search/.env
    restart: unless-stopped

  embedding-worker:
    build: ./embedding-worker
    env_file: ./embedding-worker/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
